# AMA-Agent Latency Measurement Configuration
# Inherits all AMA-Agent settings; adds output_file for JSONL latency records.

retrieval_mode: "bm25"  # Options: "none", "bm25", "llm", "embed"
# Sampling temperature for vLLM inference calls.
# Set to 0 for greedy decoding (deterministic); use >0 to estimate variance across runs.
temperature: 0.7
# Random seed for vLLM inference calls (null = no seed).
# Set to an integer (e.g. 42) to make runs reproducible; use different seeds to estimate variance.
seed: 42
max_tokens: 32000
chunk_size: 8192
enable_tools: true
causal: false

# Model configuration (will be overridden by LLM config if using vLLM)
model: "Qwen/Qwen3-32B"
base_url: "http://localhost:8002/v1"
api_key: "EMPTY"

# Embedding engine configuration
embedding_engine:
  model_name: "Qwen/Qwen3-Embedding-4B"
  base_url: "http://localhost:8003/v1"
  api_key: "EMPTY"
  batch_size: 8
  max_length: 512

# Path to output file for inference records (JSONL format)
# Each record is written incrementally: one JSON object per line
# Contains: qa_index, online_latency, total_construction_time, num_turns,
#           avg_construction_time_per_turn, retrieve_ttft, retrieve_prompt_tokens
output_file: "results/ama_agent_latency/inference_records.jsonl"
