# CSR (Cached State Representation) method config

# Sampling temperature for vLLM inference calls.
# Set to 0.0 for greedy decoding (deterministic); use >0 to estimate variance across runs.
temperature: 0.7

# Random seed for vLLM inference calls (null = no seed).
# Set to an integer (e.g. 42) to make runs reproducible; use different seeds to estimate variance.
seed: 42

# Path to output file for inference records (JSONL format)
# Each record is written incrementally: one JSON object per line
# Contains: qa_index, ttft, static_tokens, dynamic_tokens
output_file: results/csr/csr_inference_records.jsonl
