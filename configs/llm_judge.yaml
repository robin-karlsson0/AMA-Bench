# AMA-Bench Evaluation Configuration for VLLM

# Model configuration
provider: "vllm"
model: "Qwen/Qwen3.5-122B-A10B-FP8"
enable_thinking: false   # set to true to enable chain-of-thought thinking tokens

# VLLM server configuration
vllm_host: "localhost"
vllm_port: 8001

# VLLM launch configuration
vllm_launch:
  gpus: "4,5,6,7"
  max_model_len: 32000
  max_response_len: 4096
  tensor_parallel_size: 4